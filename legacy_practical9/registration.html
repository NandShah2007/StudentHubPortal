
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Student Hub</title>

    <link rel="stylesheet" href="css/registration.css">
</head>
<body>

<header class="topbar">
    <a class="brand" href="index.html">Student Hub</a>
    <a class="back-link" href="dashboard.html">Back to Dashboard</a>
</header>

<main class="registration-container">
    <section class="form-card">
        <h1>Student Registration</h1>
        <p class="subtitle">Create your Student Hub account</p>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName"
                       placeholder="Enter your full name"
                       autocomplete="name" required>
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email"
                       placeholder="student@example.com"
                       autocomplete="email" required>
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" name="mobile"
                       placeholder="10-digit mobile number"
                       inputmode="numeric" maxlength="10"
                       autocomplete="tel-national" required>
                <small class="error" id="mobileError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a strong password"
                       autocomplete="new-password" required>
                <div class="strength-track">
                    <div id="strengthBar"></div>
                </div>
                <p id="strengthText" aria-live="polite">Password strength: Not entered</p>
                <small class="hint">Use 8+ characters with uppercase, lowercase, number and symbol.</small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter your password"
                       autocomplete="new-password" required>
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="course">Course *</label>
                <select id="course" name="course" required>
                    <option value="">Select your course</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc IT">B.Sc. IT</option>
                    <option value="BTech">B.Tech</option>
                    <option value="BBA">BBA</option>
                    <option value="MCA">MCA</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="year">Academic Year *</label>
                <select id="year" name="year" required>
                    <option value="">Select academic year</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>
                <small class="error" id="yearError"></small>
            </div>

            <fieldset class="form-group gender-group">
                <legend>Gender *</legend>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
                <small class="error" id="genderError"></small>
            </fieldset>

            <div class="terms-group">
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms">
                    I agree to the terms and conditions. *
                </label>
                <small class="error" id="termsError"></small>
            </div>

            <div id="formMessage" role="status" aria-live="polite"></div>

            <div class="button-group">
                <button type="submit" class="submit-btn">Register</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>

            <p class="required-note">* Required fields</p>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Student Hub | Student Registration</p>
</footer>

<script src="js/registration.js"></script>
</body>
</html>
